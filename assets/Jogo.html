  <body>

        <h2>Jogo da sorte</h2>
    <input  type="number" id="numero" placeholder="número entre 0-100"> />
    <button onclick="verificar()">OK</button>
     
    <p id="resposta"></p>

    <script>

        let n_sorte = Math.round(Math.random()*100)
        let resposta = documento.getelementById('resposta')

        function verificar() {
        let tentativa = document.getElementById("numero").value;

    if (tentativa == n_sorte) {
        resposta.innerHTML = "Parabéns! Acertaste no número!";
    } 
    else if (tentativa > n_sorte) {
        resposta.innerHTML = "⬇️ O número da sorte é menor.";
    } 
    else {
        resposta.innerHTML = "⬆️ O número da sorte é maior.";
    }
}
    </script>
